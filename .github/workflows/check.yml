name: Check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    name: Node-only offline backend and React tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm test
      - run: npm run test:frontend
  check:
    name: Build, browser, emulator and security
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - uses: browser-actions/setup-chrome@v2
        id: chrome
      - name: Configure Chromium
        run: echo "CHROMIUM_EXECUTABLE_PATH=${{ steps.chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run build
      - run: npm run frontend:typecheck
      - run: npm run backend:typecheck
      - run: npm run lint
      - run: npm run format:check
      - name: Backend and browser regression with structured diagnostics
        shell: bash
        run: |
          set +e
          npm run test:backend -- --json --outputFile=backend-results.json
          result=$?
          if [ "$result" -ne 0 ]; then
            node <<'JS'
          const fs = require('node:fs');
          if (fs.existsSync('backend-results.json')) {
            const results = JSON.parse(fs.readFileSync('backend-results.json', 'utf8'));
            const failures = results.testResults.flatMap(test => {
              const failed = test.assertionResults.filter(assertion => assertion.status === 'failed');
              return failed.length ? failed.map(assertion => assertion.fullName + '\n' + assertion.failureMessages.join('\n')) : test.status === 'failed' ? [test.message] : [];
            });
            for (const failure of failures.slice(0, 8)) {
              const message = failure.slice(0, 3000).replaceAll('%', '%25').replaceAll('\r', '%0D').replaceAll('\n', '%0A');
              console.log('::error title=Backend/browser regression::' + message);
            }
          }
          JS
          fi
          exit "$result"
      - run: npm run test:frontend
      - run: npm run test:production
        env:
          CHROMIUM_NO_SANDBOX: 'true'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v5
        with:
          path: .cache/firebase-emulators
          key: firestore-emulator-${{ runner.os }}-${{ hashFiles('config/firestore-emulator.json') }}
      - run: npm run test:emulator
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit --audit-level=high
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: coverage
          path: |
            coverage
            backend-results.json
  docker:
    name: Docker production smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Build and smoke Docker with failure diagnostics
        shell: bash
        run: |
          set +e
          npm run test:docker > docker-output.log 2>&1
          result=$?
          cat docker-output.log
          if [ "$result" -ne 0 ]; then
            node <<'JS'
          const fs = require('node:fs');
          const lines = fs.readFileSync('docker-output.log', 'utf8').split('\n');
          for (const line of lines.filter(s => s.trim()).slice(-8)) {
            console.log('::error title=Docker smoke::' + line.replaceAll('%', '%25').replaceAll('\r', '%0D'));
          }
          JS
          fi
          exit "$result"
      - name: Verify Compose health and authentication boundaries
        run: npm run test:compose
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: docker-smoke-diagnostics
          path: docker-output.log

  container-tests:
    name: Full offline suite in test container
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Build and run isolated Node Chromium Java emulator suite
        shell: bash
        run: |
          set +e
          docker compose -f docker-compose.test.yml run --build --rm test > container-output.log 2>&1
          result=$?
          cat container-output.log
          if [ "$result" -ne 0 ]; then
            node <<'JS'
          const fs = require('node:fs');
          const lines = fs.readFileSync('container-output.log', 'utf8').split('\n');
          const failure = lines.findIndex(line => /^(FAIL|ERROR|Error:|npm error)|error TS/.test(line.trim()));
          const start = failure < 0 ? Math.max(0, lines.length - 20) : failure;
          const message = lines.slice(start, start + 25).join('\n').slice(0, 3000)
            .replaceAll('%', '%25').replaceAll('\r', '%0D').replaceAll('\n', '%0A');
          console.log('::error title=Full offline test container::' + message);
          JS
          fi
          exit "$result"
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: full-container-diagnostics
          path: container-output.log
