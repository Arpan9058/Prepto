name: Check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: browser-actions/setup-chrome@v2
        id: chrome
      - name: Configure Chromium
        run: echo "CHROMIUM_EXECUTABLE_PATH=${{ steps.chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"
      - run: npm ci
      - name: Build, lint and regression tests
        shell: bash
        run: |
          set +e
          npm run check > check-output.log 2>&1
          result=$?
          cat check-output.log
          if [ "$result" -ne 0 ]; then
            {
              echo '### Regression failure details (offline tests)'
              echo '```text'
              tail -240 check-output.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$result"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v4
        with:
          path: .cache/firebase-emulators
          key: firestore-emulator-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Firestore rules and backend emulator tests
        run: npm run test:emulator
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage
